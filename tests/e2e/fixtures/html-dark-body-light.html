<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dark html, light body</title>
<!-- html paints black (only visible as overscroll); a white body covers the whole document. The hero
     has a gradient scrim over a photo. Like nasa.gov: the page is light and must be darkened. -->
<style>
  html{background:#000}
  body{margin:0;background:#fff;color:#111;font:16px system-ui}
  .hero{position:relative;height:70vh;background:#456}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(66deg,#000 0%,rgba(0,0,0,0) 70%)}
  .hero h1{position:relative;color:#fff;margin:0;padding:40px}
  section{padding:40px;height:900px}
</style></head>
<body><div class="hero"><div class="scrim"></div><h1>Hero</h1></div><section><h2>Featured</h2><p>Light content.</p></section><section>More</section></body></html>
